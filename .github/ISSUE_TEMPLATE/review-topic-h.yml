    label: R-H1 (HUMAN)
    description: Lender/title contact missing from the file → human TC touch point (website lookup or a phone call to the title company)
    placeholder: Leave blank to approve — or type the correction here...
  validations:
    required: false
- type: textarea
  id: r_h2a
  attributes:
    label: R-H2a (AUTO)
    description: Contact exists in our rolodex → generic follow-up emails may auto-send
    placeholder: Leave blank to approve — or type the correction here...
  validations:
    required: false
- type: textarea
  id: r_h2b
  attributes:
    label: R-H2b (HUMAN)
    description: Welcome emails are never auto-sent
    placeholder: Leave blank to approve — or type the correction here...
  validations:
